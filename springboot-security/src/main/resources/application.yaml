server:
  port: 8085

spring:
  application:
    name: springboot-security
  profiles:
    # 激活的环境 (dev/test/prod)
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mybatis_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      # 连接池调优
      minimum-idle: 10               # 最小空闲连接数
      maximum-pool-size: 30          # 最大连接数 (公式: CPU核数 * 2 + 磁盘数)
      connection-timeout: 30000      # 连接超时时间 (30秒)
      idle-timeout: 600000           # 空闲连接存活最大时间 (10分钟)
      max-lifetime: 1800000          # 连接最大存活时间 (30分钟，必须小于MySQL的wait_timeout)
      pool-name: EnterpriseHikariCP  # 连接池名称，便于日志监控


mybatis-plus:
  # 实体类扫描包路径
  type-aliases-package: com.company.**.entity
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 开启驼峰命名转换 (数据库 user_name -> 实体 userName)
    map-underscore-to-camel-case: true
    # 生产环境建议关闭日志，或仅输出 SQL 执行时间，避免日志文件撑爆磁盘
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略统一使用雪花算法 (ASSIGN_ID)，避免自增 ID 暴露业务量及分库分表难题
      id-type: ASSIGN_ID
      # 逻辑删除统一配置，无需在每个实体字段上加 @TableLogic
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 表名前缀配置 (如果表名是 sys_user，实体是 User，可配置 prefix: sys_)
      # table-prefix: sys_

jwt:
  # 生产环境必须使用强随机字符串（建议 64 位以上），并通过配置中心/环境变量注入
  # 可以使用命令生成: openssl rand -base64 64
  secret: "YourSuperSecretKeyForHmacSha256MustBeAtLeast32BytesLong!!!"
  # Access Token 有效期 (单位: 毫秒)。如 2 小时 (7200000)
  expiration: 7200000
  # Refresh Token 有效期 (单位: 毫秒)。如 7 天 (604800000)
  refresh-expiration: 604800000
  # Token 请求头名称
  header: "Authorization"
  # Token 前缀
  prefix: "Bearer "