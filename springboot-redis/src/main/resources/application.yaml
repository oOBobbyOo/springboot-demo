# 服务配置
server:
  # 服务启动端口
  port: 8086

spring:
  application:
    # 应用名称
    name: springboot-redis

  # Redis 配置
  data:
    redis:
      host: localhost      # Redis 服务器地址，默认 localhost
      port: 6379           # Redis 服务端口，默认 6379
      password:            # 访问密码，没有则留空（不要写 null）
      database: 0          # 使用的数据库索引，默认 0，范围 0-15
      # username: default  # Redis 6+ ACL 用户名，未启用 ACL 时无需配置
      timeout: 3000ms      # 连接/读写超时时间，默认无超时（建议设置）
      lettuce:
        pool:
          max-active: 8    # 连接池最大连接数（负值表示无限制），默认 8
          max-idle: 8      # 连接池最大空闲连接数，默认 8
          min-idle: 0      # 连接池最小空闲连接数，默认 0
          max-wait: -1ms   # 从池中获取连接的最大等待时间，-1ms 表示一直等待

  # MySQL 数据源配置（与 docker-compose.yml 中的 mysql 服务对应）
  datasource:
    url: jdbc:mysql://localhost:3306/mybatis_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

