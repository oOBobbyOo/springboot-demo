spring:
  application:
    name: mybatis
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/mybatis_db?characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

server:
  port: 8081

# MyBatis 自定义配置
mybatis:
  config-location: classpath:mybatis-config.xml  # 可选
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.company.mybatis.entity