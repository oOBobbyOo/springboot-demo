server:
  port: 8083

spring:
  application:
    name: mybatis-plus

  devtools:
    restart:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/mybatis_db?characterEncoding=utf-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
